[package]
name = "ahl-cli"
version = "0.4.1"
edition = "2021"
rust-version = "1.92"
license = "Apache-2.0"
description = "Open self-hosted AHL client: offline Evidence Receipt verification, closure and reconstruction"
repository = "https://github.com/evidentum-io/ahl-cli"
homepage = "https://ahl-protocol.org"
readme = "README.md"
categories = ["command-line-utilities", "cryptography"]
keywords = ["provenance", "transparency-log", "merkle-tree", "ahl"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# No-panic policy: library and binary code reaches no panicking construct on any input. Every
# one of these is a way the client could abort mid-verification instead of rendering a verdict
# and exiting with a code, so they are denied crate-wide and satisfied in code rather than
# allowed at a site. The `#[cfg(test)]` modules and the integration tests allow them back at
# module or crate level: an assertion that fires IS the failure report there.
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
missing_panics_doc = "deny"
# See ahl-core Cargo.toml for the rationale: thiserror 1.x (pulled in via the registry
# `atl-core`) resolves against both syn 2.x and syn 3.x transitively.
multiple_crate_versions = "allow"

[features]
default = []
# A seam for the fuzz harness in `fuzz/`, and nothing else: it exposes the parse-and-validate
# half of three entry points the CLI otherwise reaches only through a file it opens under the
# design note §4 handle checks — the policy TOML, the corpus JSON and the receipt bytes. A fuzz
# target cannot go through those without writing a file per input, and the handle checks are
# not what is under test. Off by default; the API it adds carries no stability promise.
fuzzing = []

[[bin]]
name = "ahl-cli"
path = "src/bin/ahl-cli.rs"

[dependencies]
ahl-core = "0.5.0"
# Anti-drift with the ATL family: Merkle root computation, inclusion and consistency proof
# verification are never reimplemented here. The same registry version the siblings take.
atl-core = { version = "=0.23.2", default-features = false }
base64 = "0.22"
clap = { version = "4.6.6", features = ["derive"] }
ed25519-dalek = "2"
hex = "0.4.3"
# Handle-based (never path-based) file checks and the no-replace atomic install of design
# note §5. `libc` would work equally well but requires `unsafe`, which this crate forbids.
rustix = { version = "1.1", features = ["fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["std", "parsing", "formatting", "macros"] }
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
# HTTPS with a pluggable resolver, so the loopback rule of §7 is checked on the address
# actually connected to rather than on the hostname text.
ureq = { version = "3.4", default-features = false, features = ["rustls", "gzip"] }
# Secret bytes are wiped after use (design note §4).
zeroize = { version = "1.8", features = ["zeroize_derive"] }

[dev-dependencies]
# The same registry version the library depends on, so cargo unifies them; the integration
# tests need it to recompute the published Merkle vectors the way a foreign implementer would.
atl-core = { version = "=0.23.2", default-features = false }
# Only for the decompression-bomb fixture: `ureq`'s `gzip` feature already brings it in, so
# this adds no new entry to the dependency tree.
flate2 = "1.1.9"
hex = "0.4.3"
tempfile = "3.27.0"
