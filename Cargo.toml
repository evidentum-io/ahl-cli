[package]
name = "ahl-cli"
version = "0.1.1"
edition = "2021"
rust-version = "1.92"
license = "Apache-2.0"
description = "Open self-hosted AHL client: offline Evidence Receipt verification, closure and reconstruction"
repository = "https://github.com/evidentum-io/ahl-cli"
readme = "README.md"
categories = ["command-line-utilities", "cryptography"]
keywords = ["provenance", "transparency-log", "merkle-tree", "ahl"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
# See ahl-core Cargo.toml for the rationale: thiserror 1.x (pulled in via the pinned atl-core
# revision) resolves against both syn 2.x and syn 3.x transitively.
multiple_crate_versions = "allow"

[[bin]]
name = "ahl-cli"
path = "src/bin/ahl-cli.rs"

[dependencies]
ahl-core = { version = "0.1.0", path = "../ahl-core" }
# Anti-drift with the ATL family: Merkle root computation, inclusion and consistency proof
# verification are never reimplemented here. Pinned by the same revision the siblings use.
atl-core = { git = "https://github.com/evidentum-io/atl-core", rev = "79ac9c085857", version = "0.23.2", default-features = false }
base64 = "0.22"
clap = { version = "4.6.6", features = ["derive"] }
ed25519-dalek = "2"
hex = "0.4.3"
# Handle-based (never path-based) file checks and the no-replace atomic install of design
# note §5. `libc` would work equally well but requires `unsafe`, which this crate forbids.
rustix = { version = "1.1", features = ["fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["std", "parsing", "formatting", "macros"] }
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
# HTTPS with a pluggable resolver, so the loopback rule of §7 is checked on the address
# actually connected to rather than on the hostname text.
ureq = { version = "3.4", default-features = false, features = ["rustls", "gzip"] }
# Secret bytes are wiped after use (design note §4).
zeroize = { version = "1.8", features = ["zeroize_derive"] }

[dev-dependencies]
# The same pinned revision the library depends on, so cargo unifies them; the integration
# tests need it to recompute the published Merkle vectors the way a foreign implementer would.
atl-core = { git = "https://github.com/evidentum-io/atl-core", rev = "79ac9c085857", version = "0.23.2", default-features = false }
# Only for the decompression-bomb fixture: `ureq`'s `gzip` feature already brings it in, so
# this adds no new entry to the dependency tree.
flate2 = "1.1.9"
hex = "0.4.3"
tempfile = "3.27.0"
