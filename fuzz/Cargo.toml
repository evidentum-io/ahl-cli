[package]
name = "ahl-cli-fuzz"
version = "0.0.0"
edition = "2021"
rust-version = "1.92"
publish = false
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"

[dependencies.ahl-cli]
path = ".."
# The parse-and-validate seams the `policy`, `receipt` and `topology` targets enter through; see
# the parent `Cargo.toml` for why they are not part of the shipped API.
features = ["fuzzing"]

[lints.clippy]
# Every target is panic-free by construction: nothing here unwraps, indexes or asserts. The
# no-panic policy the parent crate states applies to this crate too, because a panic raised by
# the harness itself would be reported as a finding against the code under test.
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"

# Not a member of any workspace: the parent directory is `ahl-cli` itself, and a fuzz crate
# that joined it would put `libfuzzer-sys` and its nightly-only instrumentation into the
# client's own dependency graph.
[workspace]

[[bin]]
name = "policy"
path = "fuzz_targets/policy.rs"
test = false
doc = false
bench = false

[[bin]]
name = "receipt"
path = "fuzz_targets/receipt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "topology"
path = "fuzz_targets/topology.rs"
test = false
doc = false
bench = false

[[bin]]
name = "response"
path = "fuzz_targets/response.rs"
test = false
doc = false
bench = false
